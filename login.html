<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens - Login</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <div><img id="logo" src="assets/Logo.png"></div>
                <div><p id="h_title">SweetHavens</p></div>
            </div>
        </header>
        <div>
            <a id="login_button" href="login.html">Login</a>
            <a id="signup_button" href="signup.html">Create Account</a>
        </div>
        <div class="form_cont">
        <p class="form_header">Welcome back! Enter your details to continue.</p>
        <form id="login_form">
            <label for="f_name">Full Name</label><br>
            <input type="text" id="f_name" name="f_name" placeholder="John Doe"required><br><br>
            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" placeholder="********" required><br><br>
            <button type="submit" id="login_btn">Login</button>
            <p>No account yet? <a id="signup_button" href="signup.html">Create Account</a></p>
        </form>
        </div>
    </body>
