<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p id="h_title">SweetHavens</p></div>
            </div>
            <div id="nav_buttons">
                <div><nav><a id="nav1" href="#bestsellers">Best Sellers</a></div>
                <div><nav><a id="nav2" href="map.html">Nearest Shop</a></nav></div>
                <div><a id="nav1" href="about.html">About Us</a></div>
                <div><a id="nav1" href="cart.html">Cart</a></div>
                <div><a id="nav3">Menu</a></div>
                <div><img src="assets/user.png" id="pfp_btn"></div>
            </div>
        </header> 
        <div class="options">
            <h1>Delivery Options</h1>
            <div class="buttons">
                <button class="option-btn">Delivery</button>
                <button class="option-btn">Pick Up</button>
            </div>
            <form>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br><br>
                <label for="method">Payment Method:</label>
                <select id="method" name="method" required>
                    <option value="">Select a payment method</option>
                    <option value="cash">Cash on Delivery</option>
                    <option value="credit">Credit/Debit Card</option>
                    <option value="paypal">PayPal</option>
                </select><br><br>
            </form>
            <div class="summary">
                <h2>Order Summary</h2>
                <div>
                    <p>Subtotal:</p>
                    <p>₱ 50.00</p>
                </div>
                <div>
                    <p>Delivery Fee:</p>
                    <p>₱ 50.00</p>
                </div>
                <div>
                    <p>Total:</p>
                    <p>₱ 100.00</p>
                </div>
            </div>
                <button type="submit">Place Order</button>
        </div>
    </body>
</html>
