<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bearcat Travel & Tours my account demo.">
    <title>My account | Bearcat Travel &amp; Tours</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="admin_sript.js" defer></script>
    <script src="config.js"></script>
    <script src="api_sync.js"></script>
</head>

<body data-page="my-account" data-role="staff">
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
        <a class="brand" href="A102staff_dashboard.html" aria-label="Bearcat Travel and Tours">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span>BEARCAT<br><small>TRAVEL &amp; TOURS</small></span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
        <nav class="primary-nav" id="primary-nav" aria-label="Staff navigation">
            <a href="A102staff_dashboard.html">Dashboard</a>
            <a href="A201bookings_list.html">Bookings</a>
            <a href="A301payments_list.html">Payments</a>
            <a href="A401change_requests_list.html">Change requests</a>
            <a href="A504refunds_register.html">Refunds</a>
            <a href="A108my_recent_activity.html">Activity</a>
        </nav>
        <a class="portal-badge" href="A103my_account.html">COMPANY PERSONNEL</a>
    </header>

    <main id="main" class="page-shell">
        <header class="page-heading">
            <p class="eyebrow">COMPANY PERSONNEL · ACCOUNT SETTINGS</p>
            <h1>My account</h1>
            <p>Update your staff profile and contact information.</p>
        </header>
        <div class="live-message" id="live-message" aria-live="polite" aria-atomic="true"></div>
        <form class="surface form-card grid-form demo-form">
            <label for="field-1">Full name</label>
            <input id="field-1" type="text" placeholder="Staff name" required>
            <label for="field-2">Email address</label>
            <input id="field-2" type="email" placeholder="staff@bearcat.com" required>
            <label for="field-3">Contact number</label>
            <input id="field-3" type="text" placeholder="09XX XXX XXXX">
            <label for="field-4">Current password</label>
            <input id="field-4" type="password" placeholder="Enter current password">
            <label for="field-5">New password</label>
            <input id="field-5" type="password" placeholder="Optional">
            <div class="form-actions">
                <button class="button button-primary" type="submit">Save changes</button>
                <a class="button button-soft" href="A102staff_dashboard.html">Cancel</a>
            </div>
        </form>
    </main>
    <footer class="site-footer">
        <p>© 2026 Bearcat Travel &amp; Tours · Staff portal · Demo interface</p>
    </footer>
</body>

</html>
