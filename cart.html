<!DOCTYPE html>
<html>
    <head>
        <title>SweetHavens</title>
        <link rel="stylesheet" href="home.css">
    </head>
    <body>
        <header>
            <div id="h_title-cont">
                <img src="assets/Logo.png" id="logo">
                <div><p id="h_title">SweetHavens</p></div>
            </div>
            <div id="nav_buttons">
                <div><nav><a id="nav1" href="#bestsellers">Best Sellers</a></div>
                <div><nav><a id="nav2" href="map.html">Nearest Shop</a></nav></div>
                <div><a id="nav1" href="about.html">About Us</a></div>
                <div><a id="nav1" href="cart.html">Cart</a></div>
                <div><a id="nav3">Menu</a></div>
                <div><img src="assets/user.png" id="pfp_btn"></div>
            </div>
        </header>
        <div class="cart_cont">
            <div class="cart_card">
                <div class="cart_img-cont">
                    <img src="assets/Chocolate Chip Cookie.png" class="cart_img">
                </div>
                <div class="cart_info-cont">
                    <p class="cart_name">Chocolate Chip Cookie</p>
                    <p class="cart_price">₱ 50.00</p>
                </div>
                <div class="cart_quantity-cont">
                    <button class="cart_minus">-</button>
                    <p class="cart_quantity">1</p>
                    <button class="cart_plus">+</button>
                </div>
                <button type="submit">Proceed to Checkout</button>
            </div>
        </div>
</html>
